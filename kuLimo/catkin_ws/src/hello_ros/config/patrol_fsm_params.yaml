# patrol_fsm_params.yaml
# FSM 기반 순찰 노드 (patrol_node_fsm)의 파라미터 정의

# 순찰 지점 정의 (좌표계: map frame 기준)
# x, y는 위치, yaw는 z축 기준 회전 각도 (라디안)
patrol_points:
  - {x: -1.1, y: -3.09, yaw: -0.00137}
  - {x: -3.37, y: -4.23, yaw: -0.00137}
  - {x: -6.55, y: -0.138, yaw: -0.00137}
  - {x: -7.7, y: 1.6, yaw: -0.00137}
  - {x: -6.87, y: 5.61, yaw: -0.00143}
  - {x: -0.00951, y: 12.1, yaw: -0.00143}

# 목표 도착 후 다음 목표까지 대기하는 시간 (초)
goal_wait_time: 3.0

# 장애물 감지 관련 파라미터
# 전방 장애물 감지 거리(m): 이 거리 이내의 물체는 장애물로 간주
obstacle_distance_threshold: 0.5
# 전방 감지 각도 범위(degree): LiDAR 스캔 데이터 중 이 각도 범위만 확인 (예: 60도 = 전방 30도씩)
laser_angle_range: 60
# 장애물 판단 최소 감지 포인트 수: 전방 범위 내에서 이 개수 이상의 LiDAR 포인트가 감지되어야 장애물로 판단
min_obstacle_points: 3
# 장애물 판단을 위한 최소 유효 LiDAR 포인트 수: 전방 시야각 내에 최소한 이 개수 이상의 유효한 LiDAR 측정값이 있어야 장애물 판단을 시도
min_valid_laser_readings: 5

# 정체(Stuck) 감지 관련 파라미터
# 정체 상태 확인 주기(초): 이 주기마다 로봇의 움직임을 체크하여 정체 여부를 판단
stuck_check_interval: 1.0
# 정체 판단 시간(초): 이 시간(stuck_check_interval마다 누적) 동안
stuck_threshold_time: 5.0
# 정체 판단 이동 거리(m): 이 거리 미만으로 움직였을 경우 정체로 판단
stuck_threshold_dist: 0.1

# 회피 및 복구 동작 관련 파라미터
# 장애물 회피 시 제자리 회전 속도 (rad/s): AVOIDING 상태에서 로봇이 회전하는 속도
avoidance_turn_speed: 0.5
# 회피 동작 최대 허용 시간 (초): 무한정 회피하지 않도록 최대 시간 설정
avoidance_timeout: 10.0
# 정체 복구 시 후진 속도 (m/s): RECOVERY 상태에서 로봇이 후진하는 속도 (음수 값)
recovery_backup_speed: -0.1
# 정체 복구 시 후진하는 시간 (초): RECOVERY 상태에서 로봇이 후진을 지속하는 시간
recovery_backup_time: 3.0

# FSM 업데이트 주기 (Hz): FSM 메인 루프(_update_fsm)가 실행되는 빈도
fsm_update_frequency: 5.0